
services:
  db:
    image: postgres:18
    container_name: kloudkart-compose
    restart: unless-stopped

    environment:
      POSTGRES_DB: kloudkart_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    command:
      - postgres
      - -c
      - max_connections=500

    volumes:
      - kloudkart_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kloudkart_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kloudkart_data:
